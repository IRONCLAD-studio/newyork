<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB 스켈레톤 스튜디오</title>
<style>
:root{--bg:#eef0f4;--pn:#fff;--tx:#14161c;--mu:#5d6572;--ac:#d6262f;--bd:#d6d9e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--pn:#171a22;--tx:#eceff4;--mu:#98a1b0;--ac:#ff4650;--bd:#2a2f3a}}
:root[data-theme="dark"]{--bg:#0d0f14;--pn:#171a22;--tx:#eceff4;--mu:#98a1b0;--ac:#ff4650;--bd:#2a2f3a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
.btn,button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
#stage{flex:1;min-height:140px;position:relative;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
#dbg{position:absolute;left:6px;bottom:4px;right:6px;font-size:11px;color:var(--mu);pointer-events:none;word-break:break-all}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mu);pointer-events:none}
nav{display:flex;background:var(--pn);border-top:1px solid var(--bd)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;border-bottom:2px solid transparent}
nav button.on{color:var(--tx);border-bottom-color:var(--ac)}
.pn{background:var(--pn);padding:10px 12px;max-height:40vh;overflow:auto}
#mb{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
#mb button{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
#mb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.row input[type=range]{flex:1;min-width:80px}
.note,.mu{color:var(--mu);font-size:12px;margin:6px 0 0}
table{border-collapse:collapse;width:100%;font-size:13px}td{padding:3px 6px;border-bottom:1px solid var(--bd)}td:first-child{color:var(--mu)}
details{margin-left:12px}summary,.lf{cursor:pointer;font-size:12.5px;padding:1px 0}.lf{display:block;margin-left:12px}
i{color:var(--ac);font-style:normal;font-size:11px}
h4{margin:10px 0 4px}
</style></head><body>
<header><b>🕷 GLB 스켈레톤 스튜디오</b><label class="btn">GLB 열기<input id="fi" type="file" accept=".glb,.gltf" hidden></label></header>
<div id="stage"><div id="dbg"></div><div id="msg">GLB 파일을 열거나 화면에 끌어다 놓으세요</div></div>
<nav><button data-t="pm" class="on">모션</button><button data-t="pa">스켈레톤 분석</button></nav>
<div id="pm" class="pn">
<div id="mb"></div>
<div class="row"><button id="pp">⏸</button><input id="sc" type="range" min="0" max="1000" value="0"><span class="mu">속도</span><input id="sp" type="range" min="0.2" max="2" step="0.1" value="1" style="max-width:90px"></div>
<div class="row"><label><input type="checkbox" id="cb" checked> 본</label><label><input type="checkbox" id="cm" checked> 메쉬</label><label><input type="checkbox" id="cg" checked> 바닥 고정</label></div>
<p class="note">앞쪽 9개는 직접 만든 FK 모션, 그 뒤 8개(Pose_Keys_FK, THWIP, FIST_CURL_FK …)는 내장된 FBX 모션입니다. 포즈 5개는 정지 자세예요.</p>
</div>
<div id="pa" class="pn" hidden><p class="mu">GLB를 열면 분석 결과가 나옵니다.</p></div>

function stripTex(buf){try{const dv=new DataView(buf);if(dv.getUint32(0,true)!==0x46546C67)return null;
